[package]
name = "pccontrol"
version = "0.1.0"
edition = "2021"

[lib]
name = "pccontrol"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pccontrol"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
hex = "0.4"
egui = { version = "0.37", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
android_logger = "0.14"
log = "0.4"

[package.metadata.android]
package = "dev.veelvoer.pccontrol"
build_targets = ["aarch64-linux-android"]
apk_name = "pc-control"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "PC Control"

[package.metadata.android.application.activity]
orientation = "fullSensor"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode|smallestScreenSize|density"
